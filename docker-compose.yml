services:
    nginx:
        image: nginx:alpine
        container_name: payments-api-nginx
        restart: unless-stopped
        ports:
            - "127.0.0.1:8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - payments-network

    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: payments-api-php
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        env_file:
            - .env
        networks:
            - payments-network

    postgres:
        image: postgres:17
        container_name: payments-api-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: payments_api
            POSTGRES_USER: app
            POSTGRES_PASSWORD: local_dev_password
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - payments_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d payments_api"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - payments-network

volumes:
    payments_data:

networks:
    payments-network:
        driver: bridge
